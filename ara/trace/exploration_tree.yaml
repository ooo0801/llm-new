tree:
  - id: N01
    type: question
    title: "Complete the Qwen2.5-14B integrity-fingerprint experiment chain"
    provenance: user
    timestamp: "2026-08-07T12:40+08:00"
    description: >
      Complete robust prompt selection and independent confirmation, then run stable-component/MCC
      and prompt-stratified MMD experiments only when their registered parent gates pass.
    children:
      - id: N02
        type: experiment
        title: "Experiment E joint confirmation"
        provenance: ai-executed
        timestamp: "2026-08-07T12:45+08:00"
        result: >
          The prior frozen 30-row union retained 19/30 rather than 23 and lacked summary coverage,
          motivating a separately preregistered robust-selection experiment.
        evidence: [C03, "reproducibility/experiment_e_qwen14b_final_20260807/FINAL_REPORT.json"]
        children:
          - id: N03
            type: pivot
            title: "Return to the 64-row portfolio with multi-seed robust ranking"
            provenance: ai-suggested
            timestamp: "2026-08-07T12:50+08:00"
            from: "Confirm the fixed 30-row union"
            to: "Preregister F1 development selection with independent confirmation reserved"
            trigger: "Experiment E localized the bottleneck to joint macro robustness and structured pruning."
            children:
              - id: N04
                type: experiment
                title: "F1 development endpoint matrix"
                provenance: ai-executed
                timestamp: "2026-08-07T14:43+08:00"
                result: >
                  Technical completion: task 128/128, micro 128/128 after expansion, and macro
                  1920/1920 after expansion. Thirty-seven candidates were eligible, but the frozen
                  selector returned 29 rows.
                evidence: [C01, C02, "reproducibility/experiment_f_qwen14b_robust_20260807/FINAL_REPORT.json"]
                children:
                  - id: N05
                    type: dead_end
                    title: "Balanced 30-row F1 freeze fails category-source quotas"
                    provenance: ai-executed
                    timestamp: "2026-08-07T14:44+08:00"
                    hypothesis: >
                      The robustly ranked portfolio contains at least three eligible unique sources in every
                      category and can freeze exactly 30 rows.
                    failure_mode: >
                      Logic supplied two eligible unique sources and summary supplied one; the selector
                      returned 29/30 rows.
                    lesson: >
                      Macro robustness alone did not solve source diversity. Logic and summary construction
                      must be expanded in a separately preregistered F2 rather than repaired post hoc.
                    children:
                      - id: N06
                        type: decision
                        title: "Stop conditional confirmation, G1, and H1 branches"
                        provenance: ai-executed
                        timestamp: "2026-08-07T14:45+08:00"
                        choice: >
                          Preserve the F1 development No-Go, do not lower quotas, and do not run downstream
                          experiments whose parent gates were not supported.
                        alternatives:
                          - "Lower the per-category quota after observing results"
                          - "Insert a post-hoc thirtieth candidate"
                          - "Run G1/H1 without a confirmed parent fingerprint"
                        evidence: "Frozen F1, G1, and H1 conditional protocols plus N05."

  - id: N07
    type: decision
    title: "Fit H8 score parameters on an isolated D1-B1 bank and audit on a second bank"
    provenance: user
    timestamp: "2026-08-20T09:50+08:00"
    choice: >
      Preserve four sample structures, use 1,000 preregistered without-replacement pseudo splits
      per structure and prompt in each role, fit only on score_calibration_fit_only responses, and
      apply fixed 0.5--2.0 scale and 1.0 standardized-location independent Audit gates.
    alternatives:
      - "Pool Fit and Audit responses"
      - "Select a sample structure from calibration results"
      - "Tune the gate after observing Audit"
    evidence: "Explicit H8 D1-C authorization and frozen protocol."
    children:
      - id: N08
        type: experiment
        title: "H8 D1-C score parameter fit and independent stability audit"
        provenance: ai-executed
        timestamp: "2026-08-20T10:05+08:00"
        result: >
          PASS. The run used 1,200 Fit-only and 1,200 Audit-only D1-B1 responses with no new
          sampling, completed 48,000 Fit and 48,000 Audit pseudo splits, and froze all four score
          parameter sets. Across 24 nondegenerate structure-prompt gates the Audit/Fit scale ratio
          ranged from 0.8571 to 1.1706 and the largest standardized median shift was 0.3373.
          All 24 degenerate gates had raw MMD and score exactly zero. No sample size or aggregation
          was selected, and the detector remains not frozen.
        evidence: [C06, "reproducibility/h8_qwen32b_score_calibration_20260820/score_calibration_frozen_v1/H8_D1C_SCORE_PARAMETER_FIT_AUDIT_REPORT.json", "reproducibility/h8_qwen32b_score_calibration_20260820/score_calibration_frozen_v1/SCORE_CALIBRATION_FROZEN_MANIFEST.json"]

  - id: N09
    type: decision
    title: "Freeze the H8 D2-A detector-development design before any new sampling"
    provenance: user
    timestamp: "2026-08-20T16:20+08:00"
    choice: >
      Retain all four sample structures and only Top-2, Top-3, and Top-4 aggregation;
      use prompt-wise global permutation with B_dev=999; freeze nested R40/R60 and
      Q10/Q20 memberships; and select among twelve development configurations by the
      preregistered worst-family, mean-family, query-cost, reference-cost, then r tie-break.
    alternatives:
      - "Use local per-prompt p-values as aggregation inputs"
      - "Include Max or Energy in configuration selection"
      - "Choose Top-3 from Gaussian performance alone"
      - "Begin development response sampling before manifests and gates are frozen"
    evidence: "Explicit H8 D2-A authorization and versioned preflight protocol."
    children:
      - id: N10
        type: experiment
        title: "H8 D2-A detector-development framework and manifest preflight"
        provenance: ai-executed
        timestamp: "2026-08-20T17:10+08:00"
        result: >
          PASS with zero new model responses. The framework freezes exactly 12 candidate
          configurations, deterministic global permutation, nested sample memberships,
          role-restricted development evaluation, eight fresh attack instance identifiers,
          3,840 proposed generation seeds with no available repository overlap, and 52
          permutation streams yielding 623,376 unique prompt-level permutation seeds.
          Eleven dedicated CPU tests passed locally and on the server. The MMD and score
          layers remain frozen, while sample size, aggregation, and detector remain unselected.
        evidence: [C07, "reproducibility/h8_qwen32b_detector_development_20260820/d2a/H8_D2A_DETECTOR_DEVELOPMENT_PREFLIGHT_REPORT.json", "reproducibility/h8_qwen32b_detector_development_20260820/d2a/D2A_ARTIFACT_SHA256_INDEX.json"]
        children:
          - id: N11
            type: decision
            title: "Revise D2 configuration selection to endpoint counts before development sampling"
            provenance: user
            timestamp: "2026-08-20T11:40+08:00"
            choice: >
              Minimize false-positive count across five development-intact units, then maximize
              the worst-family detected-endpoint count, total detected endpoints, and finally
              apply the frozen q10, r40, and Top-r tie-breaks. Treat all quantities as development
              counts rather than formal FPR or TPR estimates.
            alternatives:
              - "Interpret five intact units as an FPR estimate"
              - "Interpret two endpoints per family as a stable TPR estimate"
              - "Keep the earlier worst-family-rate-first rule"
            evidence: "Explicit H8 D2-B0 authorization before any formal development response."
            children:
              - id: N12
                type: experiment
                title: "H8 D2-B0 fresh-attack materialization and smoke preflight"
                provenance: ai-executed
                timestamp: "2026-08-20T15:41+08:00"
                result: >
                  PASS with exactly eight attack_smoke_only responses and zero formal-development
                  responses. Gaussian, pruning, LoRA, and quantization each contributed two
                  endpoints. All response IDs and generation seeds were unique with zero overlap
                  against the formal development manifest. Both quantized endpoints were verified
                  as materially quantized, the two new LoRA adapter hashes did not overlap six
                  archived H6 adapters, and all GPU workers were released. H6 in-memory Gaussian,
                  pruning, and quantized state hashes were not archived, so artifact-level overlap
                  for those historical endpoints remains explicitly unverifiable. No detector
                  statistic, sample-size choice, aggregation choice, or configuration comparison ran.
                evidence: [C08, "reproducibility/h8_qwen32b_detector_development_20260820/d2b0/H8_D2B0_DEVELOPMENT_SAMPLING_AUTHORIZATION_PREFLIGHT_REPORT.json", "reproducibility/h8_qwen32b_detector_development_20260820/d2b0/D2B0_FRESHNESS_MATERIALIZATION_AUDIT.json", "reproducibility/h8_qwen32b_detector_development_20260820/d2b0/D2B0_FINAL_SHA256_INDEX.json"]
                children:
                  - id: N13
                    type: decision
                    title: "Authorize D2-B1 response generation without detector evaluation"
                    provenance: user
                    timestamp: "2026-08-20T15:55+08:00"
                    choice: >
                      Generate exactly the frozen 3,840 development responses, reuse the eight
                      D2-B0 materialized endpoint identities, preserve nested memberships, and stop
                      after response integrity auditing without global permutation or configuration selection.
                    alternatives:
                      - "Re-derive generation seeds or attack configurations"
                      - "Include D2-B0 smoke responses in the development bank"
                      - "Run detector comparison immediately after sampling"
                    evidence: "Explicit H8 D2-B1 formal development sampling authorization."
                    children:
                      - id: N14
                        type: experiment
                        title: "H8 D2-B1 formal development response sampling"
                        provenance: ai-executed
                        timestamp: "2026-08-20T19:02+08:00"
                        result: >
                          PASS. Exactly 3,840 responses were generated: 720 development Reference,
                          1,200 intact Target, and 1,920 attack responses. All 3,840 response IDs and
                          generation seeds were unique; cross-role and D2-B0-smoke overlaps were zero.
                          Each of eight endpoints contributed 240 responses, all nested-membership and
                          materialization-binding checks passed, required-field failures and technical
                          retries were zero, and every worker plus final GPU cleanup passed. The run
                          recorded 3,038 EOS stops and 802 length stops. No development comparison,
                          detector statistic, sample-size selection, aggregation selection, or detector
                          freeze occurred.
                        evidence: [C09, "reproducibility/h8_qwen32b_detector_development_20260820/d2b1/H8_D2B1_FORMAL_DEVELOPMENT_SAMPLING_REPORT.json", "reproducibility/h8_qwen32b_detector_development_20260820/d2b1/D2B1_FINAL_SHA256_INDEX.json"]
