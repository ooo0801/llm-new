experiment_name: experiment_a_qwen14b_20260805
output_dir: results/experiment_a_qwen14b_20260805
seed: 42

model:
  name: Qwen/Qwen2.5-14B-Instruct
  revision: cf98f3b3bbb457ad9e2bb7baf9a0125b6b88caa8
  dtype: bfloat16
  device_map: balanced
  max_memory:
    0: 30GiB
    1: 30GiB
    2: 30GiB
  local_files_only: true
  eager_attention: true

data:
  smoke: data/smoke.jsonl
  candidate: experiments/prompt-transfer-14b-a1/inputs/accepted16_pairs.jsonl
  validation: data/validation.jsonl
  test: data/test.jsonl
  max_candidate_rows: 16

generation:
  max_input_tokens: 512
  max_new_tokens: 128
  do_sample: false
  system_prompt: null

sensitivity:
  metric: js
  batch_size: 1
  max_length: 128
  macro:
    primary_distance: squared_l2_logits
    secondary_distances:
      - squared_l2_probabilities
      - js_probabilities
    confidence_level: 0.95
    bootstrap_samples: 1000
    seed: 42
    families:
      unstructured_pruning:
        weight: 0.2
        samples_debug: 1
        samples_formal: 2
      structured_pruning:
        weight: 0.2
        samples_debug: 1
        samples_formal: 2
      quantization:
        weight: 0.2
        samples_debug: 1
        samples_formal: 2
      gaussian_noise:
        weight: 0.2
        samples_debug: 1
        samples_formal: 2
      finetuning:
        weight: 0.2
        samples_debug: 1
        samples_formal: 2
  micro:
    method: hutchinson_jacobian_blockwise
    parameter_scope: all
    probe_distribution: rademacher
    probes_debug: 1
    probes_formal: 4
    seed: 42
    report_per_parameter: true
    report_by_component: true
  hybrid_beta: 1.0
  prompt_optimization:
    enabled: false
    hard_hybrid_validation:
      enabled: true
      micro_method: hutchinson_jacobian_blockwise
      macro_distribution: five_family_manifest
      macro_metric: macro_l2_raw
      weighting_mode: adaptive
      hybrid_beta: 1.0
      micro_prior_weight: 0.5
      macro_prior_weight: 0.5
      minimum_gain: 0.0
      calibration_pool: frozen_7b_initial_prompts
  output:
    representation: next_token_logits
    position: last_non_padding
    cast_dtype: float32

fingerprint:
  selected_size: 12
  methods:
    - mcc
  reference_repetitions: 10
  weights:
    attention: 1.2
    ffn: 1.0
    attention_residual: 0.8
    mlp_residual: 0.8

activations:
  attention_entropy_fraction: 0.7
  ffn_quantile: 0.95
  residual_threshold: 0.5
  max_ffn_units_per_layer: 128

features:
  surface: true
  semantic: true
  task: true
  semantic_model: BAAI/bge-small-zh-v1.5
  hashed_dimension: 128

statistics:
  method: prompt_stratified_mmd
  permutations: 999
  alpha: 0.05
  seed: 42

paper_alignment_version: 1
experiment_a_protocol_version: 1
