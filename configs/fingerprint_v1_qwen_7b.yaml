experiment_name: fingerprint_v1_qwen_7b
output_dir: results/fingerprint_v1_20260730
reproducibility_dir: reproducibility/fingerprint_v1_20260730
seed: 20260730

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  dtype: bfloat16
  device_map: auto
  eager_attention: true

data:
  strict16_source: reproducibility/v6_20260729/final_test_validated_prompts.jsonl
  strict16_manifest: reproducibility/fingerprint_v1_20260730/strict16_manifest.jsonl
  attack_manifest: reproducibility/fingerprint_v1_20260730/attack_manifest.jsonl
  lora_training: data/attack_train_lora.jsonl

generation:
  max_input_tokens: 512
  max_new_tokens: 64
  do_sample: true
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  system_prompt: 你是一个严谨、简洁的助手。

activations:
  repetitions: 2
  stable_component_frequency: 1.0
  attention_entropy_fraction: 0.70
  ffn_quantile: 0.95
  residual_threshold: 0.50
  max_ffn_units_per_layer: 128
  max_length: 512

fingerprint:
  selected_size: 12
  reference_repetitions: 10
  reference_seed_base: 613000
  weights:
    attention: 1.2
    ffn: 1.0
    attention_residual: 0.8
    mlp_residual: 0.8

features:
  surface: true
  semantic: true
  task: true
  semantic_model: BAAI/bge-small-zh-v1.5
  semantic_model_revision: 7999e1d3359715c523056ef9478215996d62a620
  semantic_device: cpu
  hashed_dimension: 128

statistics:
  method: prompt_stratified_mmd
  report_pooled_baseline: true
  repetitions: 10
  target_seed_base: 714000
  permutations: 999
  alpha: 0.05
  seed: 20260730

attacks:
  - variant_id: intact_v1
    family: intact
    split: fingerprint_v1_endpoint
    seed: 8803
    configuration:
      type: none

  - variant_id: unstructured_prune30_v1
    family: unstructured_pruning
    split: fingerprint_v1_endpoint
    seed: 8803
    configuration:
      type: unstructured_pruning
      ratio: 0.30
      method: layerwise_magnitude
      target_scope: attention_ffn

  - variant_id: structured_ffn20_v1
    family: structured_pruning
    split: fingerprint_v1_endpoint
    seed: 8803
    configuration:
      type: structured_pruning
      ratio: 0.20
      structure: ffn_channels
      selection: magnitude
      layer_scope: all_layers
      implementation: mask

  - variant_id: gaussian_noise001_v1
    family: gaussian_noise
    split: fingerprint_v1_endpoint
    seed: 8803
    configuration:
      type: gaussian_noise
      std_ratio: 0.001
      target_scope: all_transformer_layers
      scale_rule: parameter_tensor_std

  - variant_id: int8_v1
    family: quantization
    split: fingerprint_v1_endpoint
    seed: 8803
    configuration:
      type: quantization
      method: int8
      compute_dtype: bfloat16
      double_quant: false
      target_scope: full_model

  - variant_id: nf4_v1
    family: quantization
    split: fingerprint_v1_endpoint
    seed: 8803
    configuration:
      type: quantization
      method: nf4
      compute_dtype: bfloat16
      double_quant: true
      target_scope: full_model

  - variant_id: lora_r8_s25_v1
    family: finetuning
    split: fingerprint_v1_endpoint
    seed: 8803
    configuration:
      type: finetuning
      method: lora
      rank: 8
      alpha: 16
      dropout: 0.05
      learning_rate: 0.00005
      steps: 25
      target_scope: attention_ffn
      data_source: isolated_attack_training_data
