experiment_name: paper_aligned_qwen_7b_joint_discrete_v3_ensemble
base_config: configs/paper_aligned_qwen_7b.yaml
seed: 42
model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: main
  dtype: bfloat16
  device_map: auto
  eager_attention: true
generation:
  system_prompt: 你是一个严谨、简洁的助手。
discrete_joint_inner:
  version: 3
  prompt_pool: results/paper_aligned_qwen_7b/prompt_optimization/seeds_stratified_k60.jsonl
  training_manifest: results/paper_aligned_qwen_7b/manifests_truthful_quant/attack_manifest_train.jsonl
  validation_manifest: results/paper_aligned_qwen_7b/manifests_truthful_quant/attack_manifest_validation.jsonl
  training_adapter_registry: results/paper_aligned_qwen_7b/finetuning_adapters/adapter_registry_train.json
  validation_adapter_registry: results/paper_aligned_qwen_7b/finetuning_adapters/adapter_registry_validation.json
  max_input_tokens: 64
  formal_max_input_tokens: 128
  rounds: 3
  probes_inner: 1
  block_types:
    - q_proj
    - v_proj
    - down_proj
  representative_layer_count: 4
  candidate_positions: 4
  candidates_per_position: 16
  rerank_candidates: 6
  minimum_proxy_gain: 0.0
  variants_per_family: 2
  family_aggregation: mean
  minimum_nondegraded_families: 3
  family_relative_tolerance: 0.01
  task_guard:
    enabled: true
    max_input_tokens: 512
    max_new_tokens: 128
  macro:
    families:
      unstructured_pruning: 0.2
      structured_pruning: 0.2
      quantization: 0.2
      gaussian_noise: 0.2
      finetuning: 0.2
    distance: squared_l2_next_token_logits
    normalization: family_specific
  micro:
    normalization: block_specific
    calibration_probes: 2
  macro_weight: 1.0
  ppl_ratio_limit: 2.0
  max_edit_ratio: 0.25
  protect_digit_tokens: true
  acceptance:
    require_discrete_change: true
    require_positive_proxy_gain: true
    require_hard_validation: true
