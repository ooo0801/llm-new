experiment_name: paper_core_qwen_7b_prompt_opt
output_dir: results/paper_core_qwen_7b_prompt_opt
seed: 42
model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: main
  dtype: bfloat16
  device_map: auto
  eager_attention: true
data:
  smoke: data/smoke.jsonl
  candidate: data/candidate.jsonl
  validation: data/validation.jsonl
  test: data/test.jsonl
  max_candidate_rows: 336
generation:
  max_input_tokens: 512
  max_new_tokens: 128
  do_sample: true
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  system_prompt: 你是一个严谨、简洁的助手。
sensitivity:
  metric: js
  batch_size: 1
  max_length: 512
  macro: true
  micro: true
  micro_parameter_patterns:
  - q_proj
  - v_proj
  - down_proj
  max_parameter_tensors: 8
  hybrid_beta: 1.0
  prompt_optimization:
    enabled: true
    seed_file: results/paper_core_qwen_7b/prompt_optimization/seeds_stratified_k12.jsonl
    objective: macro_js
    training_attack: int4
    candidate_tokens: 16
    learning_rate: 0.05
    steps: 10
    initial_temperature: 1.0
    anneal: 0.95
    epsilon: 1.0
    semantic_weight: 0.1
    ppl_ratio_limit: 2.0
    max_edit_ratio: 0.25
    optimize_user_tokens_only: true
    convergence_tolerance: 0.0001
fingerprint:
  selected_size: 12
  methods:
  - mcc
  reference_repetitions: 10
  weights:
    attention: 1.2
    ffn: 1.0
    attention_residual: 0.8
    mlp_residual: 0.8
activations:
  attention_entropy_fraction: 0.7
  ffn_quantile: 0.95
  residual_threshold: 0.5
  max_ffn_units_per_layer: 128
features:
  surface: true
  semantic: true
  task: true
  semantic_model: BAAI/bge-small-zh-v1.5
  hashed_dimension: 128
statistics:
  method: paper_mmd
  permutations: 999
  alpha: 0.05
  seed: 42
attacks:
- name: prune_30
  type: pruning
  ratio: 0.3
  module_patterns:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
- name: noise_0001
  type: gaussian_noise
  std_ratio: 0.001
  module_patterns:
  - q_proj
  - v_proj
  - down_proj
  seed: 42
- name: prune_10
  type: pruning
  ratio: 0.1
  module_patterns:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
- name: prune_50
  type: pruning
  ratio: 0.5
  module_patterns:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
- name: int8
  type: int8
- name: int4
  type: int4
  compute_dtype: bfloat16
