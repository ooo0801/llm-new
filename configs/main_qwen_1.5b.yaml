experiment_name: main_qwen_1.5b
output_dir: results/main_qwen_1.5b
seed: 42
model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  revision: main
  dtype: bfloat16
  device_map: auto
  eager_attention: true
data:
  smoke: data/smoke.jsonl
  candidate: data/candidate.jsonl
  validation: data/validation.jsonl
  test: data/test.jsonl
  max_candidate_rows: 480
generation:
  max_input_tokens: 512
  max_new_tokens: 128
  do_sample: true
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  system_prompt: 你是一个严谨、简洁的助手。
sensitivity:
  metric: js
  batch_size: 4
  max_length: 512
  macro: true
  micro: true
  micro_parameter_patterns: [q_proj, k_proj, v_proj, o_proj, down_proj]
  max_parameter_tensors: 16
  hybrid_beta: 1.0
  prompt_optimization:
    enabled: true
    candidate_tokens: 64
    learning_rate: 0.10
    steps: 30
    initial_temperature: 1.0
    anneal: 0.95
    epsilon: 2.0
    semantic_weight: 0.1
fingerprint:
  selected_size: 12
  methods: [random, top_sensitivity, mcc]
  reference_repetitions: 10
  weights:
    attention: 1.2
    ffn: 1.0
    attention_residual: 0.8
    mlp_residual: 0.8
activations:
  attention_entropy_fraction: 0.70
  ffn_quantile: 0.95
  residual_threshold: 0.50
  max_ffn_units_per_layer: 128
features:
  surface: true
  semantic: true
  task: true
  semantic_model: BAAI/bge-small-zh-v1.5
  hashed_dimension: 128
statistics:
  method: paired_sign_flip
  permutations: 1000
  alpha: 0.05
  seed: 42
attacks:
  - name: replacement_0.5b
    type: replacement
    model:
      name: Qwen/Qwen2.5-0.5B-Instruct
      revision: main
      dtype: bfloat16
      device_map: auto
  - name: int8
    type: int8
  - name: int4
    type: int4
    compute_dtype: bfloat16
  - name: prune_10
    type: pruning
    ratio: 0.10
    module_patterns: &transformer_weights [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  - name: prune_30
    type: pruning
    ratio: 0.30
    module_patterns: *transformer_weights
  - name: prune_50
    type: pruning
    ratio: 0.50
    module_patterns: *transformer_weights
  - name: noise_0001
    type: gaussian_noise
    std_ratio: 0.001
    module_patterns: [q_proj, v_proj, down_proj]
    seed: 42
  - name: noise_001
    type: gaussian_noise
    std_ratio: 0.01
    module_patterns: [q_proj, v_proj, down_proj]
    seed: 42
