# Central state for the 14B follow-up sequence. Updated after each completed stage.
project:
  title: "Qwen2.5 integrity fingerprint: completed 14B validation and 32B model-specific reconstruction"
  question: "Can the validated construction method rebuild an independently confirmed sensitive-prompt pool and deterministic MCC12 on fixed-revision Qwen2.5-32B without reusing 14B model endpoints or component identities?"
  status: experiment_h6_running
  started: "2026-08-05"
  domain: "LLM integrity and cross-scale prompt transfer"
  git_branch: "experiment/h6-qwen2.5-32b-reconstruction"
  current_stage: "experiment_h6_qwen32b_formal_adapter_training"

literature:
  key_papers: []
  open_problems:
    - "Cross-scale transfer of prompt-level model sensitivity is not established by the existing V6 evidence."
  evidence_gaps:
    - "The frozen prompts have only been evaluated on Qwen2.5-7B."

hypotheses:
  - id: H-A1
    statement: "At least 12 of the 16 frozen V6 prompts will satisfy the legacy transfer-retention gate on Qwen2.5-14B."
    status: refuted
    motivation: "Twelve was the preregistered minimum accepted-set size in V6 and provides a direct same-family scale-transfer feasibility criterion."
    parent: null
    priority: high
  - id: H-B1
    statement: "At least 3 of the 4 Experiment A strict survivors will again satisfy the strict 5/5 gate under independently derived perturbation and Hutchinson seeds."
    status: supported
    motivation: "This tests whether the apparent cross-scale core is seed-stable rather than a one-run intersection."
    parent: H-A1
    priority: high
  - id: H-B2
    statement: "At least 6 of the 8 Experiment A legacy survivors will again satisfy the legacy gate under independently derived seeds."
    status: supported
    motivation: "The 75% replication threshold mirrors the original transfer feasibility criterion without selecting new prompts."
    parent: H-A1
    priority: high
  - id: H-C1
    statement: "A model-aware 14B construction run can freeze a nonempty prompt complement on calibration data and retain it on an independent validation split."
    status: supported
    motivation: "This separates transfer of exact prompt instances from transfer of the construction procedure."
    parent: H-A1
    priority: medium
  - id: H-E1
    statement: "At least 23 of the frozen 30-prompt union will satisfy the legacy gate under one new joint seed set, with all eight categories represented."
    status: refuted
    motivation: "A provenance-preserving union is not yet a jointly confirmed operational fingerprint; 23/30 preserves the project's preregistered 75% feasibility convention."
    parent: H-C1
    priority: high
  - id: H-F1
    statement: "A 30-prompt set selected from the full 64-row Experiment C portfolio by preregistered multi-seed robust ranking will retain at least 23 prompts under independent confirmation and cover all eight categories."
    status: refuted_at_development_gate
    motivation: "Experiment E localized the failure to cross-seed macro robustness, especially structured pruning, while task and complete-block micro endpoints were uniformly positive."
    parent: H-E1
    priority: high
  - id: H-G1
    statement: "The unchanged 7B stable-component thresholds yield a saturated auditable 14B empirical component universe and a deterministic global-unweighted MCC12 selection."
    status: not_run_parent_no_go
    motivation: "A confirmatory direct-threshold migration cleanly separates scale transfer from a later 14B-specific calibration if needed."
    parent: H-F1
    priority: high
  - id: H-H1
    statement: "Prompt-stratified MMD leaves the intact 14B state unflagged, detects at least 9 of 11 registered modified states, and detects at least one instance from every modified family."
    status: not_run_parent_no_go
    motivation: "Multiple registered instances per family address the single-instance limitation of the 7B descriptive detection result."
    parent: H-G1
    priority: high
  - id: H-F2
    statement: "Targeted expansion and re-optimization of logic and summary sources can freeze a 30-prompt set that independently retains at least 23 prompts and all eight categories."
    status: refuted
    motivation: "F1 failed at development only because logic and summary lacked enough eligible unique sources; F2 tests that localized construction remedy without changing the confirmation gate."
    parent: H-F1
    priority: high
  - id: H-G2
    statement: "The independently confirmed F2 set supports the unchanged stable-component thresholds, frozen universe gates, and deterministic global-unweighted MCC12."
    status: not_run_parent_no_go
    motivation: "This constructs the final operational fingerprint only after F2 independent confirmation."
    parent: H-F2
    priority: high
  - id: H-H2
    statement: "The final MCC12 leaves the intact state unflagged, detects at least 9 of 11 registered modified states, and covers all five modified families."
    status: not_run_parent_no_go
    motivation: "This is the final fixed-instance prompt-stratified MMD verification."
    parent: H-G2
    priority: high
  - id: H-G3
    statement: "The exact frozen 19-prompt F2 legacy-retained pool supports the unchanged stable-component thresholds, frozen universe gates, and a deterministic global-unweighted MCC12."
    status: supported
    motivation: "The project goal requires a deployable 12-prompt fingerprint; 19 independently retained prompts are algorithmically sufficient, while a separate preregistration preserves F2 as a No-Go."
    parent: H-F2
    priority: high
  - id: H-H3
    statement: "The G3 recovery MCC12 leaves the intact state unflagged, detects at least 9 of 11 registered modified states, and covers all five modified families."
    status: refuted
    motivation: "A new independent MMD stage is required to validate the recovery fingerprint without reusing the unused H2 identifiers or seeds."
    parent: H-G3
    priority: high
  - id: H-H4
    statement: "Common-random-number paired verification leaves all three intact reloads unflagged, detects at least 9 of 11 newly instantiated modified states, and covers all five modified families."
    status: refuted
    motivation: "H3 response replay was exact, showing that independent reference/target sampling rather than model drift confounded the two-sample detector; pairing the same generation seeds isolates model-state differences."
    parent: H-G3
    priority: high
  - id: H-H5
    statement: "A common-seed, seed-block exact-response mismatch detector leaves all three intact reloads unflagged, detects at least 9 of 11 newly instantiated modified states, covers all five modified families, and detects all three Gaussian states."
    status: supported
    motivation: "H4 restored intact specificity but its signed feature effects cancelled for Gaussian perturbations even though 7-10 of 10 H4 seed blocks contained byte-different outputs; H5 tests that non-directional paired evidence on independent endpoints."
    parent: H-G3
    priority: high
  - id: H6-P
    statement: "Fixed-revision Qwen2.5-32B model-aware reconstruction independently confirms at least 19 sensitive prompts with all eight core categories represented."
    status: preregistered_not_run
    motivation: "H5 established a fixed 14B closed loop but did not establish 32B model-specific prompt reconstruction."
    parent: H-H5
    priority: high
  - id: H6-G
    statement: "The independently confirmed H6-P pool supports stable 32B component extraction and deterministic global-unweighted MCC12 under the frozen direct-threshold-transfer gates."
    status: preregistered_not_run
    motivation: "A 32B-specific fingerprint must be rebuilt from 32B activations rather than reusing 14B component identities."
    parent: H6-P
    priority: high

