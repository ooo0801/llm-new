# Central state for the 14B follow-up sequence. Updated after each completed stage.
project:
  title: "14B follow-up: failure attribution, survivor replication, and model-aware reconstruction"
  question: "Which 7B prompts replicate under independent 14B perturbations, and can the frozen construction procedure produce an independently validated 14B-specific complement?"
  status: active
  started: "2026-08-05"
  domain: "LLM integrity and cross-scale prompt transfer"
  git_branch: "experiment/prompt-transfer-14b-followup"
  current_stage: "survivor_replication_complete"

literature:
  key_papers: []
  open_problems:
    - "Cross-scale transfer of prompt-level model sensitivity is not established by the existing V6 evidence."
  evidence_gaps:
    - "The frozen prompts have only been evaluated on Qwen2.5-7B."

hypotheses:
  - id: H-A1
    statement: "At least 12 of the 16 frozen V6 prompts will satisfy the legacy transfer-retention gate on Qwen2.5-14B."
    status: refuted
    motivation: "Twelve was the preregistered minimum accepted-set size in V6 and provides a direct same-family scale-transfer feasibility criterion."
    parent: null
    priority: high
  - id: H-B1
    statement: "At least 3 of the 4 Experiment A strict survivors will again satisfy the strict 5/5 gate under independently derived perturbation and Hutchinson seeds."
    status: supported
    motivation: "This tests whether the apparent cross-scale core is seed-stable rather than a one-run intersection."
    parent: H-A1
    priority: high
  - id: H-B2
    statement: "At least 6 of the 8 Experiment A legacy survivors will again satisfy the legacy gate under independently derived seeds."
    status: supported
    motivation: "The 75% replication threshold mirrors the original transfer feasibility criterion without selecting new prompts."
    parent: H-A1
    priority: high
  - id: H-C1
    statement: "A model-aware 14B construction run can freeze a nonempty prompt complement on calibration data and retain it on an independent validation split."
    status: active
    motivation: "This separates transfer of exact prompt instances from transfer of the construction procedure."
    parent: H-A1
    priority: medium

experiments:
  proxy_metric: "legacy_retained_count out of 16; strict_5of5_count is secondary"
  baseline_value: 16
  best_value: 8
  total_runs: 2
  trajectory:
    - run: "confirmatory_14b_a1"
      legacy_retained: 8
      strict_5of5_retained: 4
      hypothesis_supported: false
    - run: "survivor_replication_14b_b1"
      legacy_retained: 6
      legacy_cohort_size: 8
      strict_source_repeated: 3
      strict_source_cohort_size: 4
      hypothesis_supported: true
  frozen_required_retained: 12
  prompt_source: "reproducibility/v6_20260729/final_test_validated_prompts.jsonl"
  prompt_filter: "optimization.accepted == true"
  transferred_text_field: "optimization.optimized_prompt"
  paired_baseline_field: "optimization.initial_prompt"
  target_model: "Qwen/Qwen2.5-14B-Instruct"
  target_revision: "cf98f3b3bbb457ad9e2bb7baf9a0125b6b88caa8"
  target_dtype: "bfloat16"

execution:
  stage_0_protocol: complete
  stage_1_model_download: complete
  stage_2_tokenizer_config: complete
  stage_3_full_load_generation: complete
  stage_4_one_prompt_task: complete
  stage_5_one_prompt_micro_macro: complete
  stage_6_one_prompt_five_family: complete
  stage_7_all_16: complete
  stage_8_report: complete
  followup_stage_1_failure_attribution: complete
  followup_stage_2_survivor_replication: complete
  followup_stage_3_14b_reconstruction: protocol_frozen
  followup_stage_4_combined_fingerprint: pending
  background_task: null
  last_error: null

resources:
  gpu_count: 3
  gpu_model: "NVIDIA GeForce RTX 4080 SUPER"
  gpu_memory_mib_each: 32760
  nvlink: false
  model_cache: "/root/autodl-tmp/huggingface"
  python: "/root/autodl-tmp/venvs/llm-integrity/bin/python"

outer_loop:
  cycle: 3
  last_direction: "deepen_with_independent_replication_then_model_aware_reconstruction"
  last_reflection: "Independent-seed replication supported both frozen survivor hypotheses exactly at their thresholds: 6/8 legacy survivors repeated the legacy gate and 3/4 strict-source survivors repeated the strict gate. This establishes a stable cross-scale core while leaving exact-instance transfer incomplete."

workspace:
  findings: "findings.md"
  log: "research-log.md"
  literature_dir: "literature/"
  experiments_dir: "experiments/"
  to_human_dir: "to_human/"
  paper_dir: "paper/"
