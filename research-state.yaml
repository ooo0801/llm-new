# Central state for Experiment A. Updated after each completed stage.
project:
  title: "Experiment A: 7B-to-14B sensitive-prompt transfer"
  question: "Do the 16 prompts frozen on Qwen2.5-7B preserve task validity and elevated micro/macro sensitivity on Qwen2.5-14B without text optimization?"
  status: active
  started: "2026-08-05"
  domain: "LLM integrity and cross-scale prompt transfer"
  git_branch: "experiment/prompt-transfer-14b-a1"
  current_stage: "protocol_freeze"

literature:
  key_papers: []
  open_problems:
    - "Cross-scale transfer of prompt-level model sensitivity is not established by the existing V6 evidence."
  evidence_gaps:
    - "The frozen prompts have only been evaluated on Qwen2.5-7B."

hypotheses:
  - id: H-A1
    statement: "At least 12 of the 16 frozen V6 prompts will satisfy the legacy transfer-retention gate on Qwen2.5-14B."
    status: active
    motivation: "Twelve was the preregistered minimum accepted-set size in V6 and provides a direct same-family scale-transfer feasibility criterion."
    parent: null
    priority: high

