# Central state for the 14B follow-up sequence. Updated after each completed stage.
project:
  title: "Qwen2.5-14B fingerprint: transfer, reconstruction, and final joint confirmation"
  question: "Does the frozen 30-prompt union remain a usable single Qwen2.5-14B fingerprint under one new jointly applied seed set?"
  status: in_progress
  started: "2026-08-05"
  domain: "LLM integrity and cross-scale prompt transfer"
  git_branch: "experiment/combined-14b-final-validation"
  current_stage: "experiment_f1_protocol_frozen_pre_endpoint"

literature:
  key_papers: []
  open_problems:
    - "Cross-scale transfer of prompt-level model sensitivity is not established by the existing V6 evidence."
  evidence_gaps:
    - "The frozen prompts have only been evaluated on Qwen2.5-7B."

hypotheses:
  - id: H-A1
    statement: "At least 12 of the 16 frozen V6 prompts will satisfy the legacy transfer-retention gate on Qwen2.5-14B."
    status: refuted
    motivation: "Twelve was the preregistered minimum accepted-set size in V6 and provides a direct same-family scale-transfer feasibility criterion."
    parent: null
    priority: high
  - id: H-B1
    statement: "At least 3 of the 4 Experiment A strict survivors will again satisfy the strict 5/5 gate under independently derived perturbation and Hutchinson seeds."
    status: supported
    motivation: "This tests whether the apparent cross-scale core is seed-stable rather than a one-run intersection."
    parent: H-A1
    priority: high
  - id: H-B2
    statement: "At least 6 of the 8 Experiment A legacy survivors will again satisfy the legacy gate under independently derived seeds."
    status: supported
    motivation: "The 75% replication threshold mirrors the original transfer feasibility criterion without selecting new prompts."
    parent: H-A1
    priority: high
  - id: H-C1
    statement: "A model-aware 14B construction run can freeze a nonempty prompt complement on calibration data and retain it on an independent validation split."
    status: supported
    motivation: "This separates transfer of exact prompt instances from transfer of the construction procedure."
    parent: H-A1
    priority: medium
  - id: H-E1
    statement: "At least 23 of the frozen 30-prompt union will satisfy the legacy gate under one new joint seed set, with all eight categories represented."
    status: refuted
    motivation: "A provenance-preserving union is not yet a jointly confirmed operational fingerprint; 23/30 preserves the project's preregistered 75% feasibility convention."
    parent: H-C1
    priority: high
  - id: H-F1
    statement: "A 30-prompt set selected from the full 64-row Experiment C portfolio by preregistered multi-seed robust ranking will retain at least 23 prompts under independent confirmation and cover all eight categories."
    status: testing
    motivation: "Experiment E localized the failure to cross-seed macro robustness, especially structured pruning, while task and complete-block micro endpoints were uniformly positive."
    parent: H-E1
    priority: high

experiments:
  proxy_metric: "legacy_retained_count under the frozen experiment-specific set; strict_5of5_count is secondary"
  baseline_value: 16
  best_value: 8
  total_runs: 5
  trajectory:
    - run: "confirmatory_14b_a1"
      legacy_retained: 8
      strict_5of5_retained: 4
      hypothesis_supported: false
    - run: "survivor_replication_14b_b1"
      legacy_retained: 6
      legacy_cohort_size: 8
      strict_source_repeated: 3
      strict_source_cohort_size: 4
      hypothesis_supported: true
    - run: "model_aware_construction_14b_c1"
      construction_prompt_rows: 60
      development_accepted: 34
      heldout_accepted: 29
      heldout_required: 4
      hypothesis_supported: true
    - run: "joint_fingerprint_confirmation_14b_e1"
      candidate_rows: 30
      task_preserved: 30
      micro_positive: 30
      macro_positive: 19
      legacy_retained: 19
      legacy_required: 23
      strict_5of5_retained: 3
      category_coverage_passed: false
      hypothesis_supported: false
    - run: "multiseed_robust_selection_14b_f1"
      candidate_rows: 64
      development_variants_per_family: 3
      frozen_target_rows: 30
      confirmation_variants_per_family: 2
      legacy_required: 23
      category_coverage_required: 8
      status: "protocol_frozen_pre_endpoint"
  frozen_required_retained: 12
  prompt_source: "reproducibility/v6_20260729/final_test_validated_prompts.jsonl"
  prompt_filter: "optimization.accepted == true"
  transferred_text_field: "optimization.optimized_prompt"
  paired_baseline_field: "optimization.initial_prompt"
  target_model: "Qwen/Qwen2.5-14B-Instruct"
  target_revision: "cf98f3b3bbb457ad9e2bb7baf9a0125b6b88caa8"
  target_dtype: "bfloat16"

